name: SafeCheckBoard web build

on:
  push:
    branches: [main]
    paths: ['scb-app/**', '.github/workflows/scb-app.yml']
  pull_request:
    paths: ['scb-app/**', '.github/workflows/scb-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scb-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scb-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCheckBoard-web-${{ github.sha }}
          path: scb-app/dist/
          if-no-files-found: error
          retention-days: 30
